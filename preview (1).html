<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#07110d;color:#f4f7f5}
button,select,input{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#c8ff35;color:#07110d;font-weight:800}
button:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh;background:radial-gradient(circle at 80% 0,#19351f 0,#07110d 45%)}
.top{height:64px;border-bottom:1px solid #26372d;display:flex;align-items:center;padding:0 22px;justify-content:space-between;position:sticky;top:0;background:#09130fee;z-index:5;gap:10px}
.logo{font-size:21px;font-weight:900}.logo span{color:#c8ff35}
.top-right{display:flex;gap:8px;align-items:center}
.save{background:#16251c;color:white;border:1px solid #314538}
.lang-select{background:#16251c;color:#fff;border:1px solid #314538;padding:9px 10px;border-radius:10px}
.screen{max-width:1180px;margin:auto;padding:30px 22px}
.hero{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;text-align:center}
.hero h1{font-size:clamp(42px,8vw,86px);margin:0 0 16px;letter-spacing:-4px}
.hero p{color:#aab9af;max-width:650px;font-size:18px;line-height:1.6}
.big{font-size:18px;padding:16px 28px;margin-top:18px}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#0d1a13;border:1px solid #24372b;border-radius:16px;padding:20px}
.card:hover{border-color:#c8ff35}
.card h3{margin:0 0 8px}.muted{color:#91a197}
.nav{display:flex;gap:7px;overflow:auto;padding:12px 22px;border-bottom:1px solid #26372d;background:#0a1510}
.nav button{background:transparent;color:#9eafa4;padding:9px 12px;white-space:nowrap}
.nav button.active{color:#c8ff35;background:#142319}
.panel{background:#0c1811;border:1px solid #24372b;border-radius:16px;padding:22px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.form{display:grid;gap:12px;max-width:600px}
.form input,.form select{background:#101e16;color:white;border:1px solid #34493b;padding:13px;border-radius:10px}
.players{width:100%;border-collapse:collapse}
.players th,.players td{text-align:left;padding:10px;border-bottom:1px solid #223328;font-size:14px}
.players tr.me{background:#132217}
.rating{color:#c8ff35;font-weight:900}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#17281d;color:#c5d2ca;font-size:12px}
.danger{background:#351a1a;color:#ffb0b0}.success{color:#c8ff35}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #223328}
.right{text-align:right}
.toast{position:fixed;right:20px;bottom:20px;background:#c8ff35;color:#07110d;padding:13px 18px;border-radius:10px;font-weight:800;display:none;z-index:20;max-width:320px}
.pitch-wrap{display:flex;justify-content:center}
.pitch{position:relative;width:min(760px,100%);height:560px;background:#0d6b2b;border:2px solid #8bcf91;border-radius:4px;overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#8bcf91;opacity:.8}
.halfway{position:absolute;left:50%;top:50%;width:120px;height:120px;border:2px solid #8bcf91;border-radius:50%;transform:translate(-50%,-50%)}
.box{position:absolute;left:50%;width:250px;height:115px;border:2px solid #8bcf91;transform:translateX(-50%)}
.topbox{top:-2px}.bottombox{bottom:-2px}
.goal{position:absolute;left:50%;width:100px;height:22px;border:2px solid #8bcf91;transform:translateX(-50%)}
.topgoal{top:-2px}.bottomgoal{bottom:-2px}
.pitch-player{position:absolute;transform:translate(-50%,-50%);text-align:center;width:112px;font-size:12px;text-shadow:0 1px 2px #001;cursor:grab;user-select:none;z-index:2;transition:.15s}
.pitch-player:active{cursor:grabbing}.pitch-player.dragging{opacity:.4}
.pitch-player .shirt{font-size:26px;line-height:26px;position:relative}
.pitch-player .shirtnum{position:absolute;top:2px;left:0;right:0;font-size:10px;font-weight:900;color:#07110d}
.pitch-player b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitch-player span{display:block;color:#d9eadc;font-size:10px}.pitch-player strong{color:#c8ff35}
.pitch-player.hurt{opacity:.55}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bench-player{display:flex;align-items:center;gap:12px;background:#101e16;border:1px solid #2a4031;border-radius:12px;padding:12px;cursor:grab}
.bench-player.dragging{opacity:.4}.bench-num{width:28px;height:28px;border-radius:50%;background:#1b3022;display:grid;place-items:center;color:#c8ff35;font-weight:900;flex:none}
.squad-help{margin-top:12px;padding:12px;background:#101e16;border:1px solid #2a4031;border-radius:10px;color:#aab9af;font-size:14px}
.offer{border:1px solid #2b4434;border-radius:12px;padding:15px;margin-top:10px;background:#101e16}
.offer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{height:9px;background:#17281d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#c8ff35}
.bar.conf i.good{background:#c8ff35}.bar i.warn{background:#ffcc4d}.bar i.bad{background:#ff6767}
.stat{font-size:28px;font-weight:900}.season-banner{padding:18px;border:1px solid #c8ff35;border-radius:14px;background:#132217;margin-bottom:16px}
.tierbadge{font-size:11px;padding:3px 7px;border-radius:6px;margin-left:6px}
.tierbig{background:#3a2c0f;color:#ffd76a}.tiermid{background:#182c3a;color:#7fc8ff}
.hurt-badge{color:#ff8080;font-size:11px}
.euro-badge{font-size:11px;padding:3px 8px;border-radius:6px;background:#241a3a;color:#c8a6ff}
.modal-overlay{position:fixed;inset:0;background:#000000cc;display:flex;align-items:center;justify-content:center;z-index:30}
.modal-box{background:#0d1a13;border:1px solid #34493b;border-radius:16px;padding:24px;max-width:360px;width:90%}
.modal-box p{margin:0 0 16px;font-size:16px}
@media(max-width:650px){.screen{padding:22px 14px}.hero h1{letter-spacing:-2px}.top{padding:0 14px}.pitch{height:430px}.pitch-player{width:88px;font-size:10px}.pitch-player .shirt{font-size:21px}.pitch-player span{font-size:9px}}
.formation-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.formation-controls select{background:#101e16;color:#fff;border:1px solid #34493b;padding:11px;border-radius:10px}
.transfer-box{background:#101e16;border:1px solid #2a4031;border-radius:12px;padding:14px;margin-top:14px}
.matchcard{background:#101e16;border:1px solid #2a4031;border-radius:12px;padding:14px;margin-top:10px}
.scoreline{font-size:26px;font-weight:900;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo">WORLD<span>MANAGER</span></div>
 <div class="top-right">
  <select id="langSelect" class="lang-select" onchange="setLang(this.value)"></select>
  <button class="save" onclick="saveCareer()" id="saveBtn">💾</button>
 </div>
</header>
<div id="nav" class="nav hidden"></div>
<main id="app"></main>
</div>
<div id="toast" class="toast"></div>
<div id="modalOverlay" class="modal-overlay hidden"></div>

function t(path,vars){
 const parts=path.split(".");
 let node=I18N[lang]||I18N.en;
 for(const p of parts){node=node&&node[p];}
 if(node===undefined){node=I18N.en;for(const p of parts)node=node&&node[p];}
 let str=node!==undefined?node:path;
 if(vars)Object.keys(vars).forEach(k=>{str=str.replace(new RegExp("\\{"+k+"\\}","g"),vars[k]);});
 return str;
}
function setLang(l){lang=LANGS.includes(l)?l:"es";localStorage.setItem("wmLang",lang);renderLangSelect();if(state){renderNav();renderPage();}else{renderHome();}}
function renderLangSelect(){const s=document.getElementById("langSelect");s.innerHTML=LANGS.map(l=>`<option value="${l}" ${l===lang?"selected":""}>${LANG_NAMES[l]}</option>`).join("");}

let modalCallback=null;
function showConfirm(msg,cb){
 modalCallback=cb;
 document.getElementById("modalOverlay").innerHTML=`<div class="modal-box"><p>${esc(msg)}</p><div class="offer-actions"><button onclick="modalConfirm(true)">${t("common.yes")}</button><button class="danger" onclick="modalConfirm(false)">${t("common.no")}</button></div></div>`;
 document.getElementById("modalOverlay").classList.remove("hidden");
}
function modalConfirm(v){document.getElementById("modalOverlay").classList.add("hidden");const cb=modalCallback;modalCallback=null;if(cb)cb(v);}

/* ===================== VALUATION ===================== */
function tierValue(rating){
 if(rating>=90)return 90+(rating-90)*11;
 if(rating>=85)return 34+(rating-85)*11.2;
 if(rating>=80)return 12+(rating-80)*4.4;
 if(rating>=75)return 4+(rating-75)*1.6;
 if(rating>=70)return 1.2+(rating-70)*0.56;
 return Math.max(0.2,0.2+(rating-60)*0.1);
}
function ageFactor(age){
 if(age<=20)return 1.4;if(age<=22)return 1.25;if(age<=24)return 1.1;if(age<=27)return 1.0;
 if(age<=29)return 0.9;if(age<=31)return 0.68;if(age<=33)return 0.45;return 0.28;
}
function computeValue(rating,age){return Number(Math.max(0.3,tierValue(rating)*ageFactor(age||26)).toFixed(1));}
function computeWage(rating,age){return Number(Math.max(0.2,((rating-58)/8)*Math.min(1.15,ageFactor(age||26))).toFixed(2));}
function randAge(min,max){return Math.floor(min+Math.random()*(max-min+1));}
function pickNat(name){return NAT[name]||NAT_POOL[Math.floor(Math.random()*NAT_POOL.length)];}
function flagOf(code){return FLAG[code]||"🏳️";}

/* ===================== MATCH ENGINE ===================== */
function hashCode(str){let h=0;for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}return h;}
function teamStrength(name,seasonNo){
 const base=clubTier(name)==="big"?84:75;
 const offset=(Math.abs(hashCode(name+"-"+(seasonNo||1)))%9)-4;
 return base+offset;
}
function userXIStrength(){
 const arr=state.startingXI.map(n=>state.squad.find(p=>p.name===n)).filter(Boolean);
 if(!arr.length)return 70;
 return arr.reduce((a,p)=>a+p.rating,0)/arr.length;
}
function getStrength(team){return team===state.team?userXIStrength():teamStrength(team,state.seasonNo);}
function poissonGoals(lambda){
 lambda=Math.max(0.15,lambda);
 let L=Math.exp(-lambda),k=0,p=1;
 do{k++;p*=Math.random();}while(p>L);
 return k-1;
}
function poissonPair(homeStr,awayStr){
 const diff=homeStr-awayStr;
 const hg=poissonGoals(1.35+diff/20);
 const ag=poissonGoals(1.05-diff/24);
 return {hg,ag};
}
function pickScorers(n){
 if(n<=0)return [];
 const weights={ST:4,RW:3,LW:3,CAM:3,CM:2,CDM:1,CB:0.3,LB:0.3,RB:0.3,GK:0.05};
 const pool=[];
 state.startingXI.forEach(name=>{
  const p=state.squad.find(x=>x.name===name);if(!p)return;
  const w=Math.max(1,Math.round((weights[p.pos]||1)*3));
  for(let i=0;i<w;i++)pool.push(p.name);
 });
 if(!pool.length)return [];
 const out=[];
 for(let i=0;i<n;i++)out.push(pool[Math.floor(Math.random()*pool.length)]);
 return out;
}
function playFixture(home,away,detailed){
 const homeBase=getStrength(home), awayBase=getStrength(away);
 const homeAdv=home===state.team?3.5:2.8;
 const formNoise=(Math.random()-.5)*5;
 const homeStr=homeBase+homeAdv+formNoise;
 const awayStr=awayBase-formNoise*.35;
 const diff=homeStr-awayStr;
 const hg=poissonGoals(1.28+diff/18);
 const ag=poissonGoals(1.02-diff/22);
 let scorers=null;
 if(detailed&&(home===state.team||away===state.team)){
   const userGoals=home===state.team?hg:ag;
   scorers=pickScorers(userGoals);
 }
 return {hg,ag,scorers,home,away,homeAdv:Number(homeAdv.toFixed(1))};
}
function updateTable(home,away,hg,ag){
 const hRow=state.table.find(x=>x.team===home),aRow=state.table.find(x=>x.team===away);
 if(!hRow||!aRow)return;
 hRow.p++;aRow.p++;hRow.gf+=hg;hRow.ga+=ag;aRow.gf+=ag;aRow.ga+=hg;
 if(hg>ag){hRow.w++;hRow.pts+=3;aRow.l++;}else if(hg<ag){aRow.w++;aRow.pts+=3;hRow.l++;}else{hRow.d++;aRow.d++;hRow.pts++;aRow.pts++;}
}
function rollInjury(){
 if(Math.random()>0.08)return null;
 const candidates=state.startingXI.map(n=>state.squad.find(p=>p.name===n)).filter(p=>p&&!p.injured);
 if(!candidates.length)return null;
 const p=candidates[Math.floor(Math.random()*candidates.length)];
 const dur=1+Math.floor(Math.random()*3);
 p.injured=dur;
 let autoSubName=null;
 const idx=state.startingXI.indexOf(p.name);
 if(idx>=0){
  const replacement=state.bench.map(n=>state.squad.find(x=>x.name===n)).find(x=>x&&!x.injured);
  if(replacement){
   state.startingXI[idx]=replacement.name;
   state.bench=state.bench.filter(n=>n!==replacement.name);
   if(!state.bench.includes(p.name))state.bench.push(p.name);
   autoSubName=replacement.name;
  }
 }
 return {name:p.name,dur,autoSubName};
}

/* ===================== SCHEDULE (double round-robin) ===================== */
function generateSchedule(teams){
 let arr=[...teams];
 const n=arr.length,half=n/2,rounds=[];
 let list=[...arr];
 for(let r=0;r<n-1;r++){
  const round=[];
  for(let i=0;i<half;i++){
   const home=list[i],away=list[n-1-i];
   if(r%2===0)round.push({home,away});else round.push({home:away,away:home});
  }
  rounds.push(round);
  const fixed=list[0],rest=list.slice(1);
  rest.unshift(rest.pop());
  list=[fixed,...rest];
 }
 const secondLeg=rounds.map(round=>round.map(f=>({home:f.away,away:f.home})));
 return [...rounds,...secondLeg];
}

function europeLeagueMatchday(){

 e.history.push({stage:"league",matchday:idx+1,home:h,away:a,hg:r.hg,ag:r.ag,scorers:r.scorers,date:EUROPE_DATES[e.comp][idx]});
 e.played++;

   const rank=Object.entries(e.table).map(([team,v])=>({team,...v})).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);

function playEuropeKnockout(){
 const e=state.europe;
 if(!e||!["playoff","r16","qf","sf","final"].includes(e.phase))return;
 const pool=EUROPE_TEAMS[e.comp].filter(c=>c!==state.team&&!e.opponents.includes(c));
 const opp=pool[Math.floor(Math.random()*pool.length)]||"Rival europeo";
 const twoLeg=e.phase!=="final";
 const leg1=playFixture(state.team,opp,true);
 const leg2=twoLeg?playFixture(opp,state.team,true):{hg:0,ag:0,scorers:[]};
 const userAgg=twoLeg?leg1.hg+leg2.ag:leg1.hg;
 const oppAgg=twoLeg?leg1.ag+leg2.hg:leg1.ag;
 const advanced=userAgg>oppAgg||(userAgg===oppAgg&&Math.random()<0.5);
 const stage=e.phase;
 e.history.push({stage,opp,leg1,leg2,userAgg,oppAgg,advanced});
 if(!advanced){e.phase="out";addNews("😔",state.team+" eliminado de la "+europeStageLabel(e.comp),"Rival: "+opp);return;}
 if(stage==="final"){e.phase="champion";state.budget=Number((state.budget+40).toFixed(1));state.confidence=Math.min(100,(state.confidence||60)+15);addNews("🏆",t("europe.champion"),state.team);return;}
 e.phase=stage==="playoff"?"r16":stage==="r16"?"qf":stage==="qf"?"sf":"final";
 state.budget=Number((state.budget+8).toFixed(1));state.confidence=Math.min(100,(state.confidence||60)+5);
 addNews("🌍",state.team+" avanza en Europa",europeStageLabel(e.comp)+" · "+stage);
}

function makeFixtures(){
 state.schedule=generateSchedule(LEAGUES[state.league]);
 state.roundIndex=0;
 state.matchLog=[];
 state.table=LEAGUES[state.league].map(tm=>({team:tm,p:0,pts:0,w:0,d:0,l:0,gf:0,ga:0}));

function userFixtures(){
 const out=[];
 state.schedule.forEach((round,ri)=>{
  round.forEach(f=>{if(f.home===state.team||f.away===state.team)out.push({...f,matchday:ri+1,roundIdx:ri});});
 });
 return out;
}

function initializeLineup(){
 const formation=state.formation||"4-3-3",cfg=FORMATIONS[formation]||FORMATIONS["4-3-3"];
 const healthy=state.squad.filter(p=>!p.injured);
 const used=new Set(),starters=[];
 cfg.need.forEach(pos=>{
  let p=healthy.find(pl=>!used.has(pl.name)&&pl.pos===pos);
  if(!p)p=healthy.find(pl=>!used.has(pl.name));
  if(p){used.add(p.name);starters.push(p);}
 });
 while(starters.length<11){
  const p=state.squad.find(pl=>!used.has(pl.name));if(!p)break;
  used.add(p.name);starters.push(p);
 }
 state.startingXI=starters.map(p=>p.name);
 state.bench=state.squad.filter(p=>!state.startingXI.includes(p.name)).map(p=>p.name);
}

 if(sp&&sp.injured>0){toast(t("toast.blockedInjured"));return}
 const a=state.startingXI.indexOf(source),b=state.startingXI.indexOf(target);
 if(a>=0&&b>=0){[state.startingXI[a],state.startingXI[b]]=[state.startingXI[b],state.startingXI[a]];saveCareer(true);renderSquad();toast(t("squad.swapHint"));return}
 if(a<0&&b>=0){state.startingXI[b]=source;state.bench=state.bench.filter(n=>n!==source);if(!state.bench.includes(target))state.bench.push(target);saveCareer(true);renderSquad();toast(source+" "+t("squad.isStarter"))}
}

function dropOnBench(e){
 e.preventDefault();

 const i=state.startingXI.indexOf(source);if(i<0)return;
 const replacement=state.bench.find(n=>{const p=state.squad.find(x=>x.name===n);return n!==source&&p&&!p.injured;});
 if(replacement){state.startingXI[i]=replacement;state.bench=state.bench.filter(n=>n!==replacement);if(!state.bench.includes(source))state.bench.push(source);}
 saveCareer(true);renderSquad();toast(source+" "+t("squad.toBench"));
}

function renderNegotiationInline(n){
 return `<div style="background:#07110d;border:1px solid #24372b;border-radius:12px;padding:12px;margin:10px 0;font-size:14px">
 <p class="muted" style="margin:0">${t("neg.info",{round:n.round})}</p>
 </div>
 <div class="form" style="margin:0">
 <input id="fee_${n.id}" type="number" min="0.1" step=".1" value="${n.offerFee}" placeholder="${t("neg.feePh")}">
 <input id="sal_${n.id}" type="number" min="0.1" step=".1" value="${n.salary}" placeholder="${t("neg.salaryPh")}">
 <div class="offer-actions"><button onclick="submitNegotiation(${n.id})">${t("neg.send")}</button><button class="danger" onclick="cancelNegotiation(${n.id})">${t("neg.cancel")}</button></div>
 </div>`;
}
function startNegotiation(name,pos,rating,age,value,wage,nat){
 if(state.negotiations.some(n=>n.active&&n.name===name))return;
 const id=Date.now()+Math.random();
 state.negotiations.push({id,name,pos,rating,age,value,wage,nat,round:1,offerFee:Number((value*0.82).toFixed(1)),salary:Number((wage*0.85).toFixed(2)),active:true});
 saveCareer(true);renderMarket();
}
function cancelNegotiation(id){state.negotiations=state.negotiations.filter(n=>n.id!==id);saveCareer(true);renderMarket()}
function submitNegotiation(id){
 const n=state.negotiations.find(x=>x.id===id&&x.active);if(!n)return;
 const fee=Number(document.getElementById("fee_"+id).value),salary=Number(document.getElementById("sal_"+id).value);
 if(!fee||!salary||fee<=0||salary<=0)return;
 n.offerFee=fee;n.salary=salary;
 const fairFee=n.value*(1+(n.round-1)*0.10),fairSalary=n.wage*(1+(n.round-1)*0.08);
 const dealReady=fee>=fairFee*0.97&&salary>=fairSalary*0.97;
 if(dealReady){
  if(state.budget<fee){toast(t("toast.noBudget"));return}
  if(wageBill()+salary>state.wageBudget){toast(t("toast.noWage"));return}
  state.budget=Number((state.budget-fee).toFixed(1));
  const p={name:n.name,pos:n.pos,rating:n.rating,age:n.age,value:fee,salary,nat:n.nat,injured:0};
  state.squad.push(p);assignNumbers(state.squad);
  addNews("💣",t("toast.dealDone"),n.name+" → "+state.team+" · €"+fee+"M");
  state.negotiations=state.negotiations.filter(x=>x.id!==id);
  saveCareer(true);renderMarket();toast(t("toast.dealDone"));return;
 }
 const hijackChance=0.08+n.round*0.07+(n.rating>=87?0.06:0);
 if(Math.random()<hijackChance){
  const rivals=Object.values(LEAGUES).flat().filter(c=>c!==state.team);
  const club=rivals[Math.floor(Math.random()*rivals.length)];
  addNews("🚨",t("toast.hijacked",{club,name:n.name}),"");
  state.negotiations=state.negotiations.filter(x=>x.id!==id);
  saveCareer(true);renderMarket();toast(t("toast.hijacked",{club,name:n.name}));return;
 }
 if(n.round<3){
  n.round++;n.offerFee=Number(fairFee.toFixed(1));n.salary=Number(Math.max(fairSalary,salary*1.05).toFixed(2));
  addNews("🗣️",t("toast.roundUp"),n.name);
  saveCareer(true);renderMarket();toast(t("toast.roundUp"));
 }else{
  n.active=false;state.negotiations=state.negotiations.filter(x=>x.id!==id);
  addNews("❌",t("toast.broken"),n.name);
  saveCareer(true);renderMarket();toast(t("toast.broken"));
 }
}
function putForSale(name){
 const p=state.squad.find(x=>x.name===name);if(!p)return;
 if(state.sales.some(x=>x.name===name)){toast(t("toast.alreadyListed"));return}
 state.sales.push({name,asking:Math.max(0.3,Number(p.value.toFixed(1))),listedAt:Date.now()});
 addNews("📤",t("toast.listed",{name}),"");
 generateOfferFor(p);
 saveCareer(true);toast(t("toast.listed",{name}));
}
function generateOfferFor(p){
 const clubs=allTeams().filter(tm=>tm!==state.team);
 const bigOnes=clubs.filter(c=>clubTier(c)==="big"),midOnes=clubs.filter(c=>clubTier(c)==="mid");
 const wantsBig=p.rating>=83&&Math.random()<0.55&&bigOnes.length;
 const club=wantsBig?bigOnes[Math.floor(Math.random()*bigOnes.length)]:midOnes[Math.floor(Math.random()*midOnes.length)]||clubs[Math.floor(Math.random()*clubs.length)];
 const mult=clubTier(club)==="big"?(0.92+Math.random()*0.38):(0.55+Math.random()*0.4);
 const amount=Number((p.value*mult).toFixed(1));
 state.offers.push({id:Date.now()+Math.random(),player:p.name,club,amount,status:"pendiente"});
 addNews("📨",club+" — "+p.name,"€"+money(amount)+"M");
}
function allTeams(){return Object.values(LEAGUES).flat()}

/* ===================== OFFERS ===================== */
function renderOffers(){
 document.getElementById("app").innerHTML=`<div class="screen"><h1>${t("offersPage.title")}</h1>
 <div class="panel"><h2>${t("offersPage.forSale")}</h2>${state.sales.length?state.sales.map(s=>`<div class="offer"><div class="row"><b>${esc(s.name)}</b><span>${t("offersPage.asking")}: €${money(s.asking)}M</span></div><button class="danger" onclick="removeSale('${esc(s.name)}')">${t("offersPage.remove")}</button></div>`).join(""):`<p class='muted'>${t("offersPage.noSales")}</p>`}</div>
 <div class="panel"><h2>${t("offersPage.incomingT")}</h2>${state.offers.filter(o=>o.status==="pendiente").length?state.offers.filter(o=>o.status==="pendiente").map(o=>`<div class="offer"><div class="row"><div><b>${esc(o.club)}</b> ${t("offersPage.wants")} <b>${esc(o.player)}</b></div><strong>€${money(o.amount)}M</strong></div><div class="offer-actions"><button onclick="acceptOffer(${o.id})">${t("offersPage.accept")}</button><button class="danger" onclick="rejectOffer(${o.id})">${t("offersPage.reject")}</button></div></div>`).join(""):`<p class='muted'>${t("offersPage.noIncoming")}</p>`}</div></div>`;
}
function removeSale(name){state.sales=state.sales.filter(s=>s.name!==name);saveCareer(true);renderOffers()}
function acceptOffer(id){
 const o=state.offers.find(x=>x.id==id);if(!o)return;const i=state.squad.findIndex(p=>p.name===o.player);if(i<0){o.status="rejected";renderOffers();return}
 if(state.startingXI.includes(o.player)){toast(t("toast.cantSellStarter"));return}
 state.squad.splice(i,1);state.budget=Number((state.budget+o.amount).toFixed(1));o.status="accepted";state.sales=state.sales.filter(s=>s.name!==o.player);
 addNews("💰",o.club+" — "+o.player,"€"+money(o.amount)+"M");saveCareer(true);renderOffers();toast(t("toast.saleAccepted"));
}
function rejectOffer(id){const o=state.offers.find(x=>x.id==id);if(o)o.status="rejected";saveCareer(true);renderOffers();toast(t("toast.offerRejected"))}

/* ===================== CALENDAR / TABLE / EUROPE ===================== */
function renderCalendar(){
 const uf=userFixtures();
 document.getElementById("app").innerHTML=`<div class="screen"><div class="panel"><h1>${t("calendar.title")}</h1><p class="muted">${t("calendar.season")} ${state.season}</p>${uf.map(f=>{
  const played=f.roundIdx<state.roundIndex;
  const log=played?state.matchLog.find(m=>m.round===f.roundIdx):null;
  const label=played&&log?`${log.hg}-${log.ag}`:`${t("calendar.matchday")} ${f.matchday}`;
  return `<div class="fixture"><div>${f.home===state.team?"⭐ "+esc(state.team):esc(f.home)}</div><strong>${label}</strong><div class="right">${f.away===state.team?"⭐ "+esc(state.team):esc(f.away)}</div></div>`;
 }).join("")}</div></div>`;
}
function renderTable(){
 const sorted=[...state.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
 document.getElementById("app").innerHTML=`<div class="screen"><div class="panel"><h1>${t("table.title")}</h1><table class="players"><tr><th>${t("table.pos")}</th><th>${t("table.club")}</th><th>${t("table.p")}</th><th>${t("table.pts")}</th><th>${t("table.w")}</th><th>${t("table.d")}</th><th>${t("table.l")}</th><th>${t("table.gd")}</th></tr>${sorted.map((x,i)=>`<tr class="${x.team===state.team?"me":""}"><td>${i+1}</td><td>${esc(x.team)}</td><td>${x.p}</td><td><b>${x.pts}</b></td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf-x.ga>=0?"+":""}${x.gf-x.ga}</td></tr>`).join("")}</table></div></div>`;
}
function renderEurope(){
 const e=state.europe;
 if(!e){document.getElementById("app").innerHTML=`<div class="screen"><div class="panel"><h1>🌍 Europa</h1><p class="muted">${t("europe.notQualified")}</p><p class="muted">La clasificación europea 2026/27 se determina según los clubes realmente participantes.</p></div></div>`;return;}
 const standings=Object.entries(e.table).map(([tm,s])=>({team:tm,...s})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
 const status=e.phase==="champion"?"🏆 Campeón":e.phase==="out"?"❌ Eliminado":e.phase==="league"?"Fase liga":e.phase==="playoff"?"Playoff":e.phase==="r16"?"Octavos":e.phase==="qf"?"Cuartos":e.phase==="sf"?"Semifinal":"Final";
 const rows=standings.map((x,i)=>`<tr class="${x.team===state.team?"me":""}"><td>${i+1}</td><td>${esc(x.team)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf-x.ga>=0?"+":""}${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join("");
 const hist=e.history.map(h=>{
   if(h.stage==="league") return `<div class="matchcard"><span class="pill">${europeStageLabel(e.comp)} · Jornada ${h.matchday} · ${esc(h.date||"")}</span><div class="row"><b>${esc(h.home)}</b><b>${esc(h.away)}</b></div><div class="scoreline">${h.hg} - ${h.ag}</div>${h.scorers?.length?`<p class="muted">⚽ ${h.scorers.map(esc).join(", ")}</p>`:""}</div>`;
   const label=h.stage==="playoff"?"Playoff":h.stage==="r16"?"Octavos":h.stage==="qf"?"Cuartos":h.stage==="sf"?"Semifinal":"Final";
   return `<div class="matchcard"><span class="pill">${label} · ${esc(h.opp)}</span><p class="muted">Ida: ${h.leg1.hg}-${h.leg1.ag}${h.leg2?` · Vuelta: ${h.leg2.ag}-${h.leg2.hg}`:""}</p><div class="scoreline">Global: ${h.userAgg} - ${h.oppAgg}</div><p class="${h.advanced?'success':'danger'}">${h.advanced?'✅ Avanzas':'❌ Eliminado'}</p></div>`;
 }).join("");
 document.getElementById("app").innerHTML=`<div class="screen">
 <div class="row"><div><h1>🌍 ${europeStageLabel(e.comp)}</h1><p class="muted">Temporada ${esc(state.season)} · Formato UEFA 2026/27 · ${e.total} partidos de fase liga</p></div><span class="pill">${status}</span></div>
 <div class="panel"><h2>Tabla de la fase liga</h2><table class="players"><tr><th>#</th><th>Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>PTS</th></tr>${rows}</table>
 <p class="muted" style="margin-top:12px">1.º–8.º: octavos · 9.º–24.º: playoff · 25.º–36.º: eliminados.</p></div>
 <div class="panel"><h2>Trayectoria europea</h2>${hist||`<p class="muted">Todavía no hay partidos europeos.</p>`}</div>
 </div>`;
}
/* ===================== SIMULATE ===================== */
function simulate(){
 if(state.roundIndex>=state.schedule.length)return;
 state.squad.forEach(p=>{if(p.injured>0)p.injured--;});
 const round=state.schedule[state.roundIndex];
 let userFixture=null;
 round.forEach(f=>{
  const userInvolved=f.home===state.team||f.away===state.team;
  const r=playFixture(f.home,f.away,userInvolved);
  updateTable(f.home,f.away,r.hg,r.ag);
  if(userInvolved){userFixture={...f,...r};}
 });
 if(userFixture){
  state.matchLog.push({round:state.roundIndex,home:userFixture.home,away:userFixture.away,hg:userFixture.hg,ag:userFixture.ag});
  state.lastMatchReport={home:userFixture.home,away:userFixture.away,hg:userFixture.hg,ag:userFixture.ag,scorers:userFixture.scorers};
  const userIsHome=userFixture.home===state.team;
  const uGoals=userIsHome?userFixture.hg:userFixture.ag,oGoals=userIsHome?userFixture.ag:userFixture.hg;
  addNews(uGoals>oGoals?"🟢":uGoals===oGoals?"🟡":"🔴",userFixture.home+" "+userFixture.hg+"-"+userFixture.ag+" "+userFixture.away,"");
  state.confidence=Math.max(0,Math.min(100,(state.confidence||60)+(uGoals>oGoals?4:uGoals===oGoals?0:-5)));
  const inj=rollInjury();
  if(inj){
   addNews("🚑",t("toast.injury",{name:inj.name,n:inj.dur}),inj.autoSubName?t("toast.autoSub",{name2:inj.autoSubName,name:inj.name}):"");
  }
  if(Math.random()<0.22)generateRandomOffer();
 }
 const userRow=state.table.find(x=>x.team===state.team);
 if(userRow){state.points=userRow.pts;state.wins=userRow.w;state.draws=userRow.d;state.losses=userRow.l;state.played=userRow.p;}
 state.roundIndex++;
 if(state.europe){
  if(state.europe.phase==="league" && state.europe.played<state.europe.total && Math.random()<0.55) europeLeagueMatchday();
  else if(["playoff","r16","qf","sf","final"].includes(state.europe.phase) && Math.random()<0.55) playEuropeKnockout();
 }
 saveCareer(true);renderPage();toast(t("toast.simulated"));
}
function generateRandomOffer(){
 const eligible=state.squad.filter(p=>!state.startingXI.includes(p.name)&&!state.sales.some(s=>s.name===p.name));if(!eligible.length)return;
 const p=eligible[Math.floor(Math.random()*eligible.length)];generateOfferFor(p);
}

/* ===================== SEASON ===================== */
function endSeason(){
 if(state.seasonEnded){go("season");return}
 if(state.roundIndex<state.schedule.length){toast(t("toast.needCalendar"));return}
 const sorted=[...state.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
 const pos=Math.max(1,sorted.findIndex(x=>x.team===state.team)+1);
 const prize=Math.max(5,60-(pos-1)*2);
 const avg=state.squad.reduce((a,p)=>a+p.rating,0)/state.squad.length;
 state.budget=Number((state.budget+prize).toFixed(1));
 state.wageBudget=Number((state.wageBudget*(1+(60-pos)/400)).toFixed(1));
 state.seasonEnded=true;state.lastPosition=pos;state.lastPrize=prize;
 state.history.push({season:state.season,position:pos,points:state.points,prize,avg:Number(avg.toFixed(1)),euro:state.europe?state.europe.phase:null});
 addNews("🏁",t("season.title"),"#"+pos+" · €"+prize+"M");
 generateJobOffers();saveCareer(true);go("season");
}
function renderSeason(){
 if(!state.seasonEnded){
  document.getElementById("app").innerHTML=`<div class="screen"><div class="panel"><h1>${t("season.title")}</h1><p class="muted">${t("season.completeAll")}</p><p>${t("season.remaining")}: ${state.schedule.length-state.roundIndex}</p></div></div>`;return;
 }
 const h=state.history[state.history.length-1];
 document.getElementById("app").innerHTML=`<div class="screen"><div class="season-banner"><h1>🏆 ${esc(state.season)} ${t("season.finished")}</h1><p>#${state.lastPosition} · ${state.points} pts</p><p>💶 €${state.lastPrize}M</p></div>
 <div class="grid"><div class="card"><div class="muted">${t("season.wins")}</div><div class="stat">${state.wins}</div></div><div class="card"><div class="muted">${t("season.draws")}</div><div class="stat">${state.draws}</div></div><div class="card"><div class="muted">${t("season.losses")}</div><div class="stat">${state.losses}</div></div><div class="card"><div class="muted">${t("season.avg")}</div><div class="stat">${h.avg}</div></div></div>
 <div class="panel"><h2>${t("season.evolution")}</h2>${state.history.map(x=>`<div class="offer"><div class="row"><b>${esc(x.season)}</b><span>#${x.position} · ${x.points}pts · ${t("squad.rating")} ${x.avg} · €${x.prize}M</span></div></div>`).join("")}</div>
 <button onclick="newSeason()">${t("season.startNext",{season:nextSeasonName()})}</button></div>`;
}
function nextSeasonName(){const y=Number(state.season.slice(0,4))+1;return `${y}/${String(y+1).slice(2)}`}
function newSeason(){
 state.season=nextSeasonName();state.seasonNo++;state.points=0;state.wins=0;state.draws=0;state.losses=0;state.seasonEnded=false;
 state.offers=[];state.sales=[];state.negotiations=[];state.jobOffers=[];state.lastMatchReport=null;
 state.squad.forEach(p=>{const delta=Math.random()<0.55?1:-1;p.rating=Math.max(60,Math.min(95,p.rating+delta));p.age=(p.age||25)+1;p.value=computeValue(p.rating,p.age);p.salary=computeWage(p.rating,p.age);p.injured=0;});
 makeFixtures();initEurope();
 addNews("🔄",t("toast.newSeason"),"");saveCareer(true);current="dashboard";renderNav();renderPage();toast(t("toast.newSeason"));
}

function addNews(icon,headline,text){
 if(!state)return;
 if(!Array.isArray(state.newsFeed))state.newsFeed=[];
 state.newsFeed.unshift({id:Date.now()+Math.random(),icon,headline,text,date:new Date().toLocaleDateString()});
 state.newsFeed=state.newsFeed.slice(0,80);
}
function generateJobOffers(){
 if(!Array.isArray(state.jobOffers))state.jobOffers=[];
 state.jobOffers=[];
 const clubs=LEAGUES[state.league].filter(tm=>tm!==state.team).sort(()=>Math.random()-.5).slice(0,Math.min(3,LEAGUES[state.league].length-1));
 clubs.forEach((club,i)=>{
  const tier=clubTier(club);
  const budget=Math.round((tier==="big"?150:70)+Math.random()*90);
  const target=i===0?"Europe":i===1?"Top 10":"Survival";
  state.jobOffers.push({id:Date.now()+Math.random(),club,league:state.league,budget,target,status:"pendiente"});
  addNews("💼",club,target);
 });
}
function renderNews(){
 const feed=state.newsFeed||[];
 document.getElementById("app").innerHTML=`<div class="screen">
 <div class="row"><div><h1>${t("news.title")}</h1><p class="muted">${t("news.sub")}</p></div><span class="pill">${feed.length} ${t("news.count")}</span></div>
 ${feed.length?feed.map(n=>`<div class="panel"><div class="row"><span class="pill">${esc(n.icon)} ${esc(n.headline)}</span><span class="muted">${esc(n.date)}</span></div>${n.text?`<p style="font-size:16px;line-height:1.6">${esc(n.text)}</p>`:""}</div>`).join(""):`<div class="panel"><h2>${t("news.empty")}</h2><p class="muted">${t("news.emptySub")}</p></div>`}
 </div>`;
}
function renderJobs(){
 const jobs=state.jobOffers||[];
 document.getElementById("app").innerHTML=`<div class="screen"><h1>${t("jobs.title")}</h1>
 <div class="panel"><p class="muted">${t("jobs.sub")}</p></div>
 ${jobs.length?`<div class="grid">${jobs.map(j=>`<div class="card"><span class="pill">${esc(j.league)}</span><h2>${esc(j.club)}</h2><p>💰 ${t("jobs.budget")}: €${j.budget}M</p><p>🎯 ${t("jobs.target")}: <b>${esc(j.target)}</b></p><div class="offer-actions"><button onclick="acceptJob(${j.id})">${t("jobs.accept")}</button><button class="danger" onclick="rejectJob(${j.id})">${t("jobs.reject")}</button></div></div>`).join("")}</div>`:`<div class="panel"><h2>${t("jobs.empty")}</h2><p class="muted">${t("jobs.emptySub")}</p></div>`}
 </div>`;
}
function acceptJob(id){
 const j=(state.jobOffers||[]).find(x=>x.id==id);if(!j)return;
 const tier=clubTier(j.club);
 state.team=j.club;state.league=j.league;state.budget=j.budget;state.wageBudget=tier==="big"?230:100;state.confidence=55;state.points=0;state.wins=0;state.draws=0;state.losses=0;state.seasonEnded=false;state.offers=[];state.sales=[];state.negotiations=[];state.jobOffers=[];state.lastMatchReport=null;
 state.squad=squad(state.team);state.formation="4-3-3";initializeLineup();makeFixtures();initEurope();
 addNews("💼",t("toast.jobAccepted"),state.team);
 saveCareer(true);go("dashboard");toast(t("toast.jobAccepted"));
}
function rejectJob(id){
 state.jobOffers=(state.jobOffers||[]).filter(x=>x.id!=id);
 saveCareer(true);renderJobs();toast(t("toast.jobRejected"));
}

/* ===================== SAVE / LOAD ===================== */
function saveCareer(silent=false){
 if(!state){if(!silent)toast(t("toast.noActive"));return}
 const saves=JSON.parse(localStorage.getItem("worldManagerSaves")||"[]"),clean=JSON.parse(JSON.stringify(state)),i=saves.findIndex(x=>x.id===state.id);
 if(i>=0)saves[i]=clean;else saves.push(clean);localStorage.setItem("worldManagerSaves",JSON.stringify(saves));if(!silent)toast(t("toast.saved"));
}
function renderSaves(){
 document.getElementById("nav").classList.add("hidden");const saves=JSON.parse(localStorage.getItem("worldManagerSaves")||"[]");
 document.getElementById("app").innerHTML=`<div class="screen"><div class="row"><h1>${t("saves.title")}</h1><button class="save" onclick="goHome()">${t("saves.backHome")}</button></div>
 ${saves.length?`<div class="grid">${saves.map(s=>`<div class="card"><h3>${esc(s.manager)}</h3><p class="muted">${esc(s.team)} · ${esc(s.league)}</p><p>${s.season} · ${s.points}pts · €${money(s.budget)}M</p><button onclick="loadCareer(${s.id})">${t("saves.cont")}</button> <button class="danger" onclick="confirmDeleteCareer(${s.id})">${t("saves.del")}</button></div>`).join("")}</div>`:`<div class="panel"><h2>${t("saves.empty")}</h2><p class="muted">${t("saves.emptySub")}</p><button onclick="newCareer()">${t("saves.create")}</button></div>`}</div>`;
}
function loadCareer(id){
 const saves=JSON.parse(localStorage.getItem("worldManagerSaves")||"[]");state=saves.find(x=>x.id===id);
 if(state){
  if(!Array.isArray(state.newsFeed))state.newsFeed=[];
  if(!Array.isArray(state.jobOffers))state.jobOffers=[];
  if(!Array.isArray(state.negotiations))state.negotiations=[];
  if(!Array.isArray(state.matchLog))state.matchLog=[];
  if(!state.formation)state.formation="4-3-3";
  if(!state.wageBudget)state.wageBudget=100;
  if(state.confidence===undefined)state.confidence=60;
  if(state.roundIndex===undefined)state.roundIndex=state.played||0;
  if(!state.europe)initEurope();
  state.squad.forEach(p=>{if(!p.age)p.age=randAge(20,32);if(p.salary===undefined)p.salary=computeWage(p.rating,p.age);if(p.injured===undefined)p.injured=0;if(!p.nat)p.nat=pickNat(p.name);if(!p.num)p.num=Math.floor(1+Math.random()*99);});
 }
 if(!state){toast(t("toast.notFound"));return}
 current="dashboard";renderNav();renderPage();toast(t("toast.loaded"));
}
function confirmDeleteCareer(id){
 showConfirm(t("saves.confirmDel"),ok=>{if(ok)deleteCareer(id);});
}
function deleteCareer(id){
 localStorage.setItem("worldManagerSaves",JSON.stringify(JSON.parse(localStorage.getItem("worldManagerSaves")||"[]").filter(x=>x.id!==id)));
 renderSaves();
}
function goHome(){state=null;current="home";renderHome()}

renderLangSelect();
renderHome();
